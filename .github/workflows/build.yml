name: Build

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bunx tsc --noEmit
      - run: |
          test -f out/extension.js || (echo "extension.js not found" && exit 1)
          test -f out/magoRunner.js || (echo "magoRunner.js not found" && exit 1)
          test -f out/magoOutputParser.js || (echo "magoOutputParser.js not found" && exit 1)
      - run: bun run package
      - if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: "*.vsix"
          retention-days: 7
